<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>語学の見直し</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>語学の見直し</h1>
  <p id="today-label" class="today-label"></p>
</header>

<main id="main">
  <!-- 1. 今日の復習キュー -->
  <section id="view-queue" class="view">
    <h2>今日の復習キュー</h2>
    <p class="hint">おさらいは配信の3日後、テストは翌週の同じ曜日。本筋は「言語を選んでミックス復習」：その言語の回ぜんぶから混ざって出るので、「できた」行の確認も入ります。解くと自動で採点され、そのまま記録になります。間違えた行だけ、翌日と3日後に早めに出ます。「できた」行は14日後と30日後にもう一度確認が出て、両方できると「🎓卒業」です。全言語ミックスでは、似た言語（イタリア語・フランス語・ポルトガル語・ラテン語）は1回に1言語だけ、言語は最大5つまで混ざります。文の中の言葉は、押すと意味が見られます。</p>
    <div id="queue-list"></div>
  </section>

  <!-- 2. 本棚 -->
  <section id="view-shelf" class="view" hidden>
    <div id="shelf-list"></div>
    <div id="episode-detail" hidden></div>
  </section>

  <!-- 3. 表現帳 -->
  <section id="view-phrases" class="view" hidden>
    <h2>表現帳</h2>
    <div class="filters">
      <label>言語
        <select id="filter-lang"></select>
      </label>
      <label class="check">
        <input type="checkbox" id="filter-mistakes"> 間違えた物だけ
      </label>
    </div>
    <p id="phrases-count" class="hint"></p>
    <div id="phrases-list"></div>
  </section>

  <!-- 4. クイズ -->
  <section id="view-quiz" class="view" hidden>
    <div id="quiz-box"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="queue" class="tab active">今日の復習</button>
  <button data-tab="shelf" class="tab">本棚</button>
  <button data-tab="phrases" class="tab">表現帳</button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* 登録できなくてもアプリは動く */ });
  });
}
</script>
</body>
</html>
