<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101426">
<title>ふたりの部屋</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1 id="header-title">ふたりの部屋</h1>
  <button id="signout-btn" class="text-btn" hidden>サインアウト</button>
</header>

<div id="offline-banner" class="offline-banner" hidden>オフラインです。接続が戻るまで送れません（下書きは残ります）。</div>
<div id="lock-banner" class="lock-banner" hidden></div>

<main>
  <!-- 設定未完了 -->
  <section id="setup-view" hidden>
    <p class="hint">アプリの設定がまだ完了していません。</p>
    <p class="note">Firebase のウェブ設定（firebase-config.js）が実値に差し替わっていないため、接続できません。設定の残り手順は CONSOLE_PROCEDURE.md にあります。</p>
  </section>

  <!-- サインイン -->
  <section id="login-view" hidden>
    <p class="hint">本人確認のため、Google アカウントでサインインしてください。</p>
    <button id="signin-btn" class="primary-btn">Google でサインイン</button>
    <p id="login-error" class="error" hidden></p>
    <p class="note">ホーム画面に追加すると、アプリとして全画面で開けます。</p>
  </section>

  <!-- 対象外アカウント -->
  <section id="denied-view" hidden>
    <p class="hint">このアカウントでは入口を使えません。</p>
    <p class="note">入口は本人のアカウント専用です。別のアカウントでサインインし直してください。</p>
    <button id="denied-signout-btn" class="primary-btn">サインアウト</button>
  </section>

  <!-- 会話画面（ニトロの部屋） -->
  <section id="chat-view" hidden>
    <div id="messages" class="messages"></div>
    <div id="typing-row" class="typing-row" hidden>
      <div class="typing-bubble"><span></span><span></span><span></span></div>
      <span id="typing-label" class="typing-label">考え中…</span>
    </div>
    <p id="composer-note" class="composer-note" hidden></p>
    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="メッセージを書く" autocomplete="off"></textarea>
      <button id="send-btn" type="submit">送る</button>
    </form>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
